name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-flight runs on the same PR / branch when a new commit arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # --------------------------------------------------------------------------
  # Python: lint + security + dep audit.
  # No tests yet (see mlops/docs/09_roadmap.md task #9). Wire pytest in here
  # the moment we add unit tests.
  # --------------------------------------------------------------------------
  python-quality:
    name: Python — lint + security + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mlops/requirements.txt

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pip-audit

      - name: Ruff
        run: ruff check .

      - name: Bandit (medium+ severity)
        run: bandit -r mlops -ll -x mlops/venv,mlops/venv-new

      - name: pip-audit
        run: pip-audit -r mlops/requirements.txt

  # --------------------------------------------------------------------------
  # Backend: TypeScript typecheck + dependency audit.
  # --------------------------------------------------------------------------
  backend-quality:
    name: Backend — tsc + npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/backend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: npm audit (high+)
        run: npm audit --audit-level=high
        # Don't block on transitive vulns we can't immediately fix; promote
        # to required once the dep tree is clean.
        continue-on-error: true

  # --------------------------------------------------------------------------
  # Frontend: typecheck, build, lint, audit.
  # --------------------------------------------------------------------------
  frontend-quality:
    name: Frontend — typecheck + build + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build (Next.js)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Build-time URL only — the real value is supplied by Compose at
          # image build. CI just needs SOMETHING here so the build succeeds.
          NEXT_PUBLIC_API_URL: http://localhost:3001
        run: npm run build

      - name: npm audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true

  # --------------------------------------------------------------------------
  # Docker: build both images. No push — verifies the Dockerfiles compile
  # in a clean environment with all required context.
  # --------------------------------------------------------------------------
  docker-build:
    name: Docker — build (no push)
    runs-on: ubuntu-latest
    needs: [python-quality, backend-quality, frontend-quality]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/backend/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          tags: shelfopt-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/frontend/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          tags: shelfopt-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3001
