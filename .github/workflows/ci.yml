name: CI

on:
  pull_request:
  push:

# Cancel in-flight runs on the same PR / branch when a new commit arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # --------------------------------------------------------------------------
  # Detect which parts of the repo changed so we can skip unaffected jobs.
  # --------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'mlops/**'
            backend:
              - 'web/backend/**'
            frontend:
              - 'web/frontend/**'
            docker:
              - 'mlops/**'
              - 'web/backend/**'
              - 'web/frontend/**'
              - '**/Dockerfile'
              - 'docker-compose*.yml'
              - '.dockerignore'

  # --------------------------------------------------------------------------
  # Python: lint + security + dep audit.
  # --------------------------------------------------------------------------
  python-quality:
    name: Python — lint + security + audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mlops/requirements.txt

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pip-audit
          pip install -r mlops/requirements.txt
          pip install -e mlops/
          pip install pytest pytest-cov

      - name: Ruff
        run: ruff check .

      - name: Bandit (medium+ severity)
        run: bandit -r mlops -ll -x mlops/venv,mlops/venv-new

      - name: pip-audit
        run: pip-audit -r mlops/requirements.txt

      - name: Tests with coverage
        run: python -m pytest mlops/tests/ -v --cov=mlops/utils --cov=mlops/models --cov-report=term-missing --cov-fail-under=70 --cov-config=mlops/.coveragerc

  # --------------------------------------------------------------------------
  # Backend: TypeScript typecheck + dependency audit.
  # --------------------------------------------------------------------------
  backend-quality:
    name: Backend — tsc + npm audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: web/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/backend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: npm audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true

  # --------------------------------------------------------------------------
  # Frontend: typecheck, build, lint, audit.
  # --------------------------------------------------------------------------
  frontend-quality:
    name: Frontend — typecheck + build + lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build (Next.js)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: http://localhost:3001
        run: npm run build

      - name: npm audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true

  # --------------------------------------------------------------------------
  # Backend: Jest unit & integration tests with coverage.
  # --------------------------------------------------------------------------
  backend-test:
    name: Backend — tests + coverage
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: web/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/backend/package-lock.json

      - run: npm ci

      - name: Tests with coverage
        run: npx jest --coverage

  # --------------------------------------------------------------------------
  # Frontend: Jest unit & component tests with coverage.
  # --------------------------------------------------------------------------
  frontend-test:
    name: Frontend — tests + coverage
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - run: npm ci

      - name: Tests with coverage
        run: npx jest --coverage

  # --------------------------------------------------------------------------
  # E2E: Playwright tests with MOCK_PYTHON (no real Python needed).
  # --------------------------------------------------------------------------
  e2e-test:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    needs: [changes, backend-test, frontend-test]
    if: |
      always() &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') &&
      !contains(needs.*.result, 'failure')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend deps
        working-directory: web/backend
        run: npm ci

      - name: Install frontend deps
        working-directory: web/frontend
        run: npm ci

      - name: Install E2E deps + Playwright browsers
        working-directory: web/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Prepare mlops directories
        run: mkdir -p mlops/data/monthly mlops/results

      - name: Run E2E tests
        working-directory: web/e2e
        env:
          MOCK_PYTHON: "1"
          CI: "true"
          MLOPS_DIR: ${{ github.workspace }}/mlops
          RESULTS_DIR: ${{ github.workspace }}/mlops/results
          PORT: "3001"
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/e2e/playwright-report/
          retention-days: 7

  # --------------------------------------------------------------------------
  # Docker: build both images (no push). Only runs when files that affect
  # the images change, and only after the relevant quality jobs pass.
  # --------------------------------------------------------------------------
  docker-build:
    name: Docker — build (no push)
    runs-on: ubuntu-latest
    needs: [changes, python-quality, backend-quality, backend-test, frontend-quality, frontend-test, e2e-test]
    if: |
      always() &&
      needs.changes.outputs.docker == 'true' &&
      !contains(needs.*.result, 'failure')
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af
          df -h

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/backend/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          tags: shelfopt-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/frontend/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          tags: shelfopt-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3001
