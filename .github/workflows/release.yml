name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write       # required to push to GHCR

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Build + push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image refs (lowercase repo name)
        id: refs
        run: |
          REPO_LC="${GITHUB_REPOSITORY,,}"
          echo "backend=ghcr.io/${REPO_LC}-backend"  >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${REPO_LC}-frontend" >> "$GITHUB_OUTPUT"
          # Strip the leading 'v' from the tag for the semver tag,
          # but also keep the full ref for `latest` etc.
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build + push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/backend/Dockerfile
          push: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          tags: |
            ${{ steps.refs.outputs.backend }}:${{ steps.refs.outputs.tag }}
            ${{ steps.refs.outputs.backend }}:latest

      - name: Build + push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/frontend/Dockerfile
          push: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL || 'http://localhost:3001' }}
          tags: |
            ${{ steps.refs.outputs.frontend }}:${{ steps.refs.outputs.tag }}
            ${{ steps.refs.outputs.frontend }}:latest
